# VORA — déploiement cible. NON UTILISÉ PENDANT LE HACKATHON.
# En développement, chacun utilise son PostgreSQL local : voir CLAUDE.md § 4 « Base de données ».
# Ce fichier décrit ce qu'on déploierait sur une VM, et sert de réponse au jury sur la mise en production.
#
# Contexte de build attendu : la racine du dépôt.
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file .env up -d --build
#
# Pas de Redis : les positions des chauffeurs vivent en mémoire dans le processus api (CLAUDE.md § 3).
# En production réelle, c'est la première brique à ajouter — elle conditionne la réplication de l'api.

name: vora

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: vora/api:${VORA_VERSION:-dev}
    container_name: vora-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TZ: Africa/Douala
      # Dans le conteneur, la base est jointe par le nom du service, pas par localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-vora}:${POSTGRES_PASSWORD:?mot de passe requis}@postgres:5432/${POSTGRES_DB:-vora}
      JWT_SECRET: ${JWT_SECRET:?secret requis}
      QUOTE_HMAC_SECRET: ${QUOTE_HMAC_SECRET:?secret requis}
      # En production, le simulateur de chauffeurs et les endpoints /v1/demo/* sont éteints.
      DEMO_MODE: "false"
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SHARE_BASE_URL: ${SHARE_BASE_URL}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgis/postgis:16-3.4
    container_name: vora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe requis}
      POSTGRES_DB: ${POSTGRES_DB:-vora}
      TZ: Africa/Douala
      PGTZ: Africa/Douala
    volumes:
      - vora-pgdata:/var/lib/postgresql/data
      # Joué une seule fois, à la création du volume : postgis, pg_trgm, unaccent, pgcrypto.
      # Le même fichier sert au poste local, appliqué par `npm run db:setup`.
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vora} -d ${POSTGRES_DB:-vora}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Pas de port publié : seule l'api joint la base.

volumes:
  vora-pgdata:
